[package]
name = "BatStore"
version = "0.0.131"
edition = "2024"
authors = ["Amir Tonta <amir.tonta@mathematik.uni-marburg.de>"]
description = "BatStore Research Implementation"
repository = "https://github.com/umr-dbs/BatStore"
# `tests/` holds unit-test files pulled into the bin crate via `#[path]` mods
# (this crate has no `[lib]` target, so they can't be real integration
# tests) alongside genuine standalone integration tests. Autodiscovery would
# try to compile every one of those unit-test files as its own integration-
# test crate too, which fails (they use `crate::...` internals that don't
# exist outside the bin). Disabled in favor of explicit `[[test]]` entries
# below for the files that really are standalone.
autotests = false

[profile.dev]
overflow-checks = false

[profile.release]
#debug = "line-tables-only"
#overflow-checks = false
opt-level = 3            # maximum LLVM optimizations
lto = "fat"              # full link-time optimization (cross-crate)
codegen-units = 1        # better optimization, slower compile
panic = "abort"          # removes unwinding overhead
strip = true             # smaller binary (optional)
debug = 0                # no debug info
incremental = false      # better optimization consistency

[profile.profiling]
inherits = "release"
debug = true
strip = false

[features]
hardware-lock-elision = []
# Gates the libmdbx-backed comparison engine (src/bat_bench/mdbx_ycsb.rs/mdbx_tpcc.rs) -
# optional since it's a second, independent storage backend (path-copying/copy-on-write
# B+Tree via libmdbx) alongside this crate's own MVBTree, not something every build needs.
mdbx-backend = ["dep:libmdbx"]
# Gates `src/bat_viz` (structural tree/root* dump -> JSON for the standalone
# `tools/tree_visualizer.html` viewer) - a debug/inspection tool, not
# anything the benchmark/paper path needs, so its `serde`/`serde_json` deps
# stay out of the default build.
tree-viz = ["dep:serde", "dep:serde_json"]
# Swaps the global allocator from jemalloc to mimalloc (see `main.rs`) - an
# A/B experiment for the WAL writer's cross-thread alloc/free pattern (buffer
# allocated on a worker thread, freed on the flush thread): mimalloc's
# per-page lock-free "thread free list" targets exactly that producer-
# consumer pattern, unlike jemalloc's cross-arena free. When this is on,
# `bat_bench::mem_stats`'s jemalloc-specific stats columns read as zero (no
# real jemalloc arena is active) - use the allocator-independent VmRSS
# column instead.
mimalloc = ["dep:mimalloc"]

[[bin]]
name = "batstore"
path = "src/main.rs"

#[lib]
#name = "batstore"
#path = "src/lib.rs"
#crate-type = ["cdylib"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
CCBPlusTree = { git = "https://github.com/umr-dbs/CC-BPlusTree.git", version = "0.0.122" }
crossbeam-channel = "0.5.16"
crossbeam-skiplist = "0.1.3"
crossbeam-utils = "0.8.22"
chrono = "0.4.45"
rand_distr = "0.6.0"
rand = "0.10.2"
fastrand = "2.5.0"
itertools = "0.15.0"
parking_lot = { version = "0.12.5", features = ["hardware-lock-elision", "arc_lock"] }
arc-swap = "1.9.2"
smallvec = "1.15.2"
libmdbx = { version = "0.6.6", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
num_cpus = "1.17"
jemallocator = "0.5.4"
jemalloc-ctl = "0.5.4"
mimalloc = { version = "0.1", optional = true }
triomphe = "0.1.16"

[dev-dependencies]
loom = "0.7"

[[test]]
name = "loom_registration_ordering"
path = "tests/loom_registration_ordering.rs"

[[test]]
name = "loom_read_validation"
path = "tests/loom_read_validation.rs"
